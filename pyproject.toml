[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conjunctural"
version = "0.1.0"
description = "Brazilian Macroeconomic & Financial Time-Series Backtester & Indicator Engine"
readme = "README.md"
authors = [{ name = "Conjunctural Analytics" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "pyield>=0.50.0",
    "pyarrow>=12.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
conjunctural = "conjunctural.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["conjunctural*"]
